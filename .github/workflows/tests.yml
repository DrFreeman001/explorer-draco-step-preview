name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q --junitxml=report.xml
      # Chaque test en échec devient une annotation lisible sur la page de l'exécution.
      - if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          failed = [c.get('classname') + '.' + c.get('name') for c in ET.parse('report.xml').iter('testcase')
                    if c.find('failure') is not None or c.find('error') is not None]
          # GitHub ne garde que dix annotations par étape : la liste complète tient dans la première.
          print('::error title=' + str(len(failed)) + ' tests en échec::' + '%0A'.join(failed))
          for case in ET.parse("report.xml").iter("testcase"):
              for kind in ("failure", "error"):
                  for problem in case.findall(kind):
                      text = (problem.get("message") or "") + " " + (problem.text or "")[-1500:]
                      text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
